# Builds Kiwame for macOS (Apple Silicon + Intel), Windows and Linux. See RELEASING.md.
#   push a tag v1.2.3  -> installers attached to a DRAFT GitHub Release, for you to review and publish
#   Run workflow       -> the same builds as downloadable artifacts, no release
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # creating the draft release and uploading to it

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks (lint, types, tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e . --group dev
      - run: ruff format --check nkqa tests && ruff check nkqa tests
      - run: pyright --project pyproject.toml
      - run: pytest -q

  build:
    name: ${{ matrix.name }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false # one platform failing should not hide whether the others work
      matrix:
        include:
          - { name: macOS Apple Silicon, runner: macos-14, server: nkqa-server }
          - { name: macOS Intel, runner: macos-15-intel, server: nkqa-server }
          - { name: Windows x64, runner: windows-latest, server: nkqa-server.exe }
          - { name: Linux x64, runner: ubuntu-22.04, server: nkqa-server } # older glibc: the AppImage runs on more distros
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Linux packages for the window (WebKitGTK)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Python dependencies
        run: python -m pip install --upgrade pip && pip install -e . --group dev

      # PyInstaller cannot cross-compile, which is why each platform builds on its own runner.
      - name: Build the server (PyInstaller onedir)
        run: |
          pyinstaller --noconfirm nkqa-server.spec
          python -c "import shutil; shutil.copytree('dist/nkqa-server', 'desktop/src-tauri/binaries/nkqa-server', symlinks=False, dirs_exist_ok=True)"

      - name: Smoke-test the server
        run: python scripts/smoke_server.py dist/nkqa-server/${{ matrix.server }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: Build the app and attach it to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Kiwame ${{ github.ref_name }}
          releaseBody: Installers for macOS (Apple Silicon and Intel), Windows and Linux. Unsigned for now - see RELEASING.md for how to open them.
          releaseDraft: true
          prerelease: false

      - name: Build the app (test build, no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop

      - name: Upload the installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: kiwame-${{ matrix.runner }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
