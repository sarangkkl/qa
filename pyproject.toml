[project]
name = 'nkqa'
version = '0.1.0'
description = 'AI QA teammate: plans test scenarios, executes approved ones in a real browser, records evidence'
requires-python = '>=3.13'
dependencies = ['browser-use[video]>=0.13.8', 'pyyaml', 'python-dotenv']

[project.scripts]
qa = 'nkqa.cli:main'

[build-system]
requires = ['setuptools>=77']
build-backend = 'setuptools.build_meta'

[tool.setuptools]
packages = ['nkqa', 'nkqa.execution']

[dependency-groups]
dev = ['ruff', 'pyright', 'pytest']

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ['venv', 'kt', 'qa_output']

[tool.ruff.format]
quote-style = 'single'
indent-style = 'tab'

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'UP', 'B', 'SIM', 'RUF']
ignore = ['W191']  # tabs are the chosen indent style

[tool.pyright]
typeCheckingMode = 'strict'
venvPath = '.'
venv = 'venv'
include = ['nkqa', 'tests']

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']  # until the package is pip-installed in Phase 1
